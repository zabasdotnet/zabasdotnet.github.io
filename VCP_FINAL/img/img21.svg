<svg xmlns="http://www.w3.org/2000/svg" width="500" height="143" viewBox="0 0 500 143">
  <rect width="500" height="143" rx="8" fill="#0a1520"/>
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="8.5"
        font-weight="700" fill="#2a7ab5" letter-spacing="2">OFFICIAL KNOWLEDGE — VMware VCP-DCV</text>
  <text font-family="Arial,sans-serif">
    <tspan x="20" y="43" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Para un entorno de 400 hosts y 4000 VMs, el tamaño de vCenter</tspan>
    <tspan x="20" y="59" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">'Medium' requiere 8 vCPUs y 24 GB de RAM. Sin embargo, con los</tspan>
    <tspan x="20" y="75" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">tamaños oficiales de vCSA, el tamaño 'Small' soporta hasta 400</tspan>
    <tspan x="20" y="91" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">hosts/4000 VMs con 8 vCPUs y 24GB. La respuesta correcta según</tspan>
    <tspan x="20" y="107" fill="#e0f4ff" font-size="10.5">VMware es D (8 CPUs) y B (30 GB Memory) para el tamaño medium.</tspan>
  </text>
  <line x1="20" y1="119" x2="480" y2="119" stroke="#152535" stroke-width="1"/>
  <text x="250" y="135" font-family="Arial,sans-serif" font-size="8.5"
        text-anchor="middle" fill="#2a5a85">Q21 de 110 · VMware VCP-DCV oficial</text>
</svg>