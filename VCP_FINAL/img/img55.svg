<svg xmlns="http://www.w3.org/2000/svg" width="500" height="159" viewBox="0 0 500 159">
  <rect width="500" height="159" rx="8" fill="#0a1520"/>
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="8.5"
        font-weight="700" fill="#2a7ab5" letter-spacing="2">OFFICIAL KNOWLEDGE — VMware VCP-DCV</text>
  <text font-family="Arial,sans-serif">
    <tspan x="20" y="43" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Para que los usuarios puedan ver el cluster de management pero</tspan>
    <tspan x="20" y="59" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">editar los de workload: (B) aplicar Global permissions con Read Only</tspan>
    <tspan x="20" y="75" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">y propagation al objeto raíz de vCenter (para ver todo el</tspan>
    <tspan x="20" y="91" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">inventario), y luego aplicar permissions de vCenter con el rol</tspan>
    <tspan x="20" y="107" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">custom en los 5 clusters de workload con propagation habilitado</tspan>
    <tspan x="20" y="123" fill="#e0f4ff" font-size="10.5">(para que los permisos se hereden en todos los objetos del cluster).</tspan>
  </text>
  <line x1="20" y1="135" x2="480" y2="135" stroke="#152535" stroke-width="1"/>
  <text x="250" y="151" font-family="Arial,sans-serif" font-size="8.5"
        text-anchor="middle" fill="#2a5a85">Q55 de 110 · VMware VCP-DCV oficial</text>
</svg>