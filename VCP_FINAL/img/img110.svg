<svg xmlns="http://www.w3.org/2000/svg" width="500" height="207" viewBox="0 0 500 207">
  <rect width="500" height="207" rx="8" fill="#0a1520"/>
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="8.5"
        font-weight="700" fill="#2a7ab5" letter-spacing="2">OFFICIAL KNOWLEDGE — VMware VCP-DCV</text>
  <text font-family="Arial,sans-serif">
    <tspan x="20" y="43" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Para resolver el problema de alto uso de CPU por el proceso vpxd y</tspan>
    <tspan x="20" y="59" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">garantizar futuros cambios sin downtime: (E) apagar gracefully</tspan>
    <tspan x="20" y="75" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">vCenter desde vSphere Client, (G) añadir CPU adicional al appliance</tspan>
    <tspan x="20" y="91" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">para resolver el problema inmediato, (B) encender la vCSA desde</tspan>
    <tspan x="20" y="107" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">vSphere Host Client (vCenter está apagado), y (C) habilitar CPU Hot</tspan>
    <tspan x="20" y="123" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Add en la VM de vCenter para que futuras ampliaciones de CPU no</tspan>
    <tspan x="20" y="139" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">requieran downtime. La opción D (CPU+Memory Hot Add) no es correcta</tspan>
    <tspan x="20" y="155" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">aquí porque el problema es exclusivamente de CPU; la opción correcta</tspan>
    <tspan x="20" y="171" fill="#e0f4ff" font-size="10.5">para el futuro es solo CPU Hot Add (C).</tspan>
  </text>
  <line x1="20" y1="183" x2="480" y2="183" stroke="#152535" stroke-width="1"/>
  <text x="250" y="199" font-family="Arial,sans-serif" font-size="8.5"
        text-anchor="middle" fill="#2a5a85">Q110 de 110 · VMware VCP-DCV oficial</text>
</svg>