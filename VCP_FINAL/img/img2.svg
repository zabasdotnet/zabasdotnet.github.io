<svg xmlns="http://www.w3.org/2000/svg" width="500" height="175" viewBox="0 0 500 175">
  <rect width="500" height="175" rx="8" fill="#0a1520"/>
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="8.5"
        font-weight="700" fill="#2a7ab5" letter-spacing="2">OFFICIAL KNOWLEDGE — VMware VCP-DCV</text>
  <text font-family="Arial,sans-serif">
    <tspan x="20" y="43" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Para recopilar bundles de logs de hosts ESXi existen múltiples vías:</tspan>
    <tspan x="20" y="59" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">(D) desde vSphere Client se puede generar un bundle por host</tspan>
    <tspan x="20" y="75" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">individual, (E) desde vCenter Management Interface también se genera</tspan>
    <tspan x="20" y="91" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">uno por host, y (B) desde vSphere Host Client se puede generar el</tspan>
    <tspan x="20" y="107" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">log bundle del host conectado directamente. La generación combinada</tspan>
    <tspan x="20" y="123" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">de todos los hosts en una sola operación se realiza desde vSphere</tspan>
    <tspan x="20" y="139" fill="#e0f4ff" font-size="10.5">Client, no desde VAMI.</tspan>
  </text>
  <line x1="20" y1="151" x2="480" y2="151" stroke="#152535" stroke-width="1"/>
  <text x="250" y="167" font-family="Arial,sans-serif" font-size="8.5"
        text-anchor="middle" fill="#2a5a85">Q2 de 110 · VMware VCP-DCV oficial</text>
</svg>