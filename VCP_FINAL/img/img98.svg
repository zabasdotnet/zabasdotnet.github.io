<svg xmlns="http://www.w3.org/2000/svg" width="500" height="159" viewBox="0 0 500 159">
  <rect width="500" height="159" rx="8" fill="#0a1520"/>
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="8.5"
        font-weight="700" fill="#2a7ab5" letter-spacing="2">OFFICIAL KNOWLEDGE — VMware VCP-DCV</text>
  <text font-family="Arial,sans-serif">
    <tspan x="20" y="43" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">El health check de Teaming and Failover en un VDS muestra 'Unknown'</tspan>
    <tspan x="20" y="59" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">cuando no hay suficientes hosts conectados para realizar la</tspan>
    <tspan x="20" y="75" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">verificación. Se necesitan al menos 2 hosts con 2 uplinks cada uno</tspan>
    <tspan x="20" y="91" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">(configuración mínima para verificar el balanceo y failover de</tspan>
    <tspan x="20" y="107" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">teaming), ya que la comprobación requiere comparar configuraciones</tspan>
    <tspan x="20" y="123" fill="#e0f4ff" font-size="10.5">entre múltiples hosts.</tspan>
  </text>
  <line x1="20" y1="135" x2="480" y2="135" stroke="#152535" stroke-width="1"/>
  <text x="250" y="151" font-family="Arial,sans-serif" font-size="8.5"
        text-anchor="middle" fill="#2a5a85">Q98 de 110 · VMware VCP-DCV oficial</text>
</svg>