<svg xmlns="http://www.w3.org/2000/svg" width="500" height="159" viewBox="0 0 500 159">
  <rect width="500" height="159" rx="8" fill="#0a1520"/>
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="8.5"
        font-weight="700" fill="#2a7ab5" letter-spacing="2">OFFICIAL KNOWLEDGE — VMware VCP-DCV</text>
  <text font-family="Arial,sans-serif">
    <tspan x="20" y="43" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Para conceder permiso de snapshots a un único usuario sin afectar a</tspan>
    <tspan x="20" y="59" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">otros: (D) crear un rol custom con los privilegios de Virtual</tspan>
    <tspan x="20" y="75" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">Machine Snapshot Management, y (B) añadir un nuevo permiso en el</tspan>
    <tspan x="20" y="91" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">objeto de la VM seleccionando el usuario específico y el nuevo rol</tspan>
    <tspan x="20" y="107" fill="#e0f4ff" font-size="10.5" textLength="460" lengthAdjust="spacingAndGlyphs">custom. Esto es más granular que modificar el rol Read Only</tspan>
    <tspan x="20" y="123" fill="#e0f4ff" font-size="10.5">existente que afectaría a todos los usuarios del grupo VM_Viewers.</tspan>
  </text>
  <line x1="20" y1="135" x2="480" y2="135" stroke="#152535" stroke-width="1"/>
  <text x="250" y="151" font-family="Arial,sans-serif" font-size="8.5"
        text-anchor="middle" fill="#2a5a85">Q72 de 110 · VMware VCP-DCV oficial</text>
</svg>