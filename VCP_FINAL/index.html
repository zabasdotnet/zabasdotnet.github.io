<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Examen IT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; padding: 20px; color: #333; margin: 0; }
        .card { background: white; max-width: 750px; margin: 30px auto; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1e3a8a; font-size: 1.4rem; line-height: 1.5; margin-top: 0; }
        .info-header { font-weight: bold; color: #6b7280; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 10px; display: block; }
        .option-container { display: block; margin: 12px 0; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .option-container:hover { background: #f1f5f9; }
        .option-container input { margin-right: 12px; transform: scale(1.1); }
        .btn-container { margin-top: 25px; display: flex; justify-content: flex-end; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #1d4ed8; }
        .result-good { color: #16a34a; font-weight: bold; }
        .result-bad { color: #dc2626; font-weight: bold; }
        .review-block { background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #cbd5e1; }
        .review-block.correct-block { border-left-color: #16a34a; }
        .review-block.incorrect-block { border-left-color: #dc2626; }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card" id="quiz-container">
    <!-- Pantalla de carga Local -->
    <div id="file-picker-section" style="text-align: center; padding: 20px;">
        <h2 style="margin-bottom: 25px;">Simulador de Cuestionarios</h2>
        <p>Por seguridad de Windows, selecciona tu archivo <strong>preguntas.txt</strong> para iniciar el examen:</p>
        <input type="file" id="file-input" accept=".txt" style="display:none;" onchange="cargarDesdeArchivo(this)">
        <button onclick="document.getElementById('file-input').click()">Seleccionar preguntas.txt</button>
    </div>

    <!-- Cuerpo del Examen -->
    <div id="quiz-body" style="display:none;">
        <span class="info-header" id="question-number">Pregunta</span>
        <h2 id="question-text">Estructurando cuestionario...</h2>
        <div id="options-container"></div>
        <div class="btn-container">
            <button id="next-btn" onclick="nextQuestion()">Siguiente</button>
        </div>
    </div>

    <!-- Pantalla de Resultados -->
    <div id="result-body" style="display:none;">
        <h2 style="font-size: 2rem; color: #1e3a8a;">Resultado del Examen</h2>
        <p id="score-text" style="font-size: 1.2rem; font-weight: bold;"></p>
        <hr>
        <div id="review-container"></div>
        <br>
        <button onclick="location.reload()">Repetir Examen</button>
    </div>
</div>

<script>
let questions = [];
let currentQuestionIndex = 0;
let score = 0;
let userAnswers = [];

// INTENTO AUTOMÁTICO (Para cuando esté subido en GitHub.io)
fetch('preguntas.txt')
    .then(response => {
        if (!response.ok) throw new Error("No remoto");
        return response.text();
    })
    .then(text => {
        // Si está en un servidor (GitHub), oculta el selector y procesa directo
        document.getElementById('file-picker-section').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'block';
        parsearTextoPreguntas(text);
    })
    .catch(() => {
        // Si está en local (D:\...), se queda esperando que uses el botón obligatoriamente
        console.log("Modo local activado: Esperando selección manual de preguntas.txt");
    });

// LECTURA LOCAL MEDIANTE EL BOTÓN
function cargarDesdeArchivo(input) {
    let file = input.files[0];
    if (!file) return;
    
    let reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('file-picker-section').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'block';
        parsearTextoPreguntas(e.target.result);
    };
    reader.readAsText(file, "UTF-8");
}

// PROCESADOR DE TU FORMATO EXACTO (DUMPS)
function parsearTextoPreguntas(text) {
    let rawBlocks = text.split(/Question:\s*/i);
    
    rawBlocks.forEach(block => {
        if (!block.trim()) return;
        
        let lines = block.split('\n');
        let qNum = lines[0].trim();
        
        let textLines = [];
        let options = [];
        let correctAnswers = [];
        let gatheringText = true;

        for (let i = 1; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            if (line.toLowerCase().includes('respuesta correcta:')) {
                let ansPart = line.split(/respuesta correcta:\s*/i);
                if (ansPart[1]) {
                    correctAnswers = ansPart[1].split(',').map(x => x.trim().toUpperCase());
                }
                gatheringText = false;
            } 
            else if (/^[A-Z1l]\.\s+/i.test(line)) {
                gatheringText = false;
                let match = line.match(/^([A-Z1l])\.\s*(.*)/i);
                if (match) {
                    let letter = match[1].toUpperCase();
                    if (letter === '1' || letter === 'L') letter = 'L'; // Normalizar fallos comunes de OCR
                    options.push({ letter: letter, text: line });
                }
            } 
            else if (gatheringText) {
                textLines.push(line);
            }
        }

        if (textLines.length > 0) {
            questions.push({
                number: qNum,
                question: textLines.join('<br>'),
                options: options,
                correct: correctAnswers
            });
        }
    });

    if (questions.length > 0) {
        showQuestion();
    } else {
        document.getElementById('question-text').innerText = "Formato de texto no reconocido en preguntas.txt.";
    }
}

function showQuestion() {
    if (currentQuestionIndex >= questions.length) {
        showResults();
        return;
    }
    
    let q = questions[currentQuestionIndex];
    document.getElementById('question-number').innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length} (ID original: ${q.number})`;
    document.getElementById('question-text').innerHTML = q.question;
    
    let optionsDiv = document.getElementById('options-container');
    optionsDiv.innerHTML = '';

    // Si tiene más de una letra en la solución, activa casillas cuadradas (checkbox), sino circulares (radio)
    let inputType = q.correct.length > 1 ? 'checkbox' : 'radio';

    q.options.forEach(opt => {
        optionsDiv.innerHTML += `
            <label class="option-container">
                <input type="${inputType}" name="quiz-option" value="${opt.letter}">
                ${opt.text}
            </label>
        `;
    });
}

function nextQuestion() {
    let selected = Array.from(document.querySelectorAll('input[name="quiz-option"]:checked')).map(el => el.value);
    
    if (selected.length === 0) {
        alert("Por favor, selecciona una respuesta.");
        return;
    }

    let q = questions[currentQuestionIndex];
    let isCorrect = selected.length === q.correct.length && selected.every(val => q.correct.includes(val));
    
    if (isCorrect) score++;
    
    userAnswers.push({
        number: q.number,
        question: q.question,
        selected: selected,
        correct: q.correct,
        isCorrect: isCorrect,
        rawOptions: q.options.map(o => o.text)
    });

    currentQuestionIndex++;
    showQuestion();
}

function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('result-body').style.display = 'block';
    
    let porcentaje = ((score / questions.length) * 100).toFixed(1);
    document.getElementById('score-text').innerHTML = `Has acertado <span class="result-good">${score}</span> de ${questions.length} preguntas (${porcentaje}%).`;
    
    let reviewDiv = document.getElementById('review-container');
    reviewDiv.innerHTML = '<h3 style="color: #1e3a8a;">Revisión de respuestas:</h3>';
    
    userAnswers.forEach((ans, index) => {
        let blockClass = ans.isCorrect ? 'correct-block' : 'incorrect-block';
        let statusText = ans.isCorrect ? '✓ CORRECTA' : '✗ INCORRECTA';
        let statusClass = ans.isCorrect ? 'result-good' : 'result-bad';
        
        let opcionesHtml = ans.rawOptions.map(o => `<li>${o}</li>`).join('');

        reviewDiv.innerHTML += `
            <div class="review-block ${blockClass}">
                <p><strong>P${index + 1} (ID: ${ans.number}):</strong> ${ans.question}</p>
                <ul style="list-style-type: none; padding-left: 10px;">${opcionesHtml}</ul>
                <p style="margin-top:10px;">Tu selección: <strong>${ans.selected.join(', ')}</strong> <span class="${statusClass}">[${statusText}]</span></p>
                <p>Respuesta correcta: <strong class="result-good">${ans.correct.join(', ')}</strong></p>
            </div>
        `;
    });
}
</script>
</body>
</html>
